apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-runbook.fullname" . }}-config
  labels:
    {{- include "ai-runbook.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_DEBUG: {{ .Values.config.appDebug | quote }}
  APP_ALLOWED_ORIGINS: {{ .Values.config.appAllowedOrigins | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  CHROMA_HOST: {{ .Values.config.chromaHost | quote }}
  CHROMA_PORT: {{ .Values.config.chromaPort | quote }}
  CHROMA_COLLECTION_NAME: {{ .Values.config.chromaCollectionName | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  RERANKER_ENABLED: {{ .Values.config.rerankerEnabled | quote }}
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.jwtAccessTokenExpireMinutes | quote }}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.config.jwtRefreshTokenExpireDays | quote }}
  VAULT_ENABLED: {{ .Values.config.vaultEnabled | quote }}
  VAULT_ADDR: {{ .Values.config.vaultAddr | quote }}
  SNOW_ENABLED: {{ .Values.config.snowEnabled | quote }}
  OIDC_ENABLED: {{ .Values.config.oidcEnabled | quote }}
