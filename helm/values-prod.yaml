# Production overrides — managed DB/cache, External Secrets, full HA
image:
  pullPolicy: Always

api:
  replicaCount: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 20

celery:
  replicaCount: 3
  autoscaling:
    minReplicas: 2
    maxReplicas: 12

# Use managed PostgreSQL (RDS / Cloud SQL) — disable subchart
postgresql:
  enabled: false

# Use managed Redis (ElastiCache / Memorystore) — disable subchart
redis:
  enabled: false

# Pull all secrets from Vault via External Secrets Operator
externalSecrets:
  enabled: true
  refreshInterval: 15m
  secretStore: vault-backend

config:
  vaultEnabled: "true"
  vaultAddr: "https://vault.internal:8200"
  appEnv: production
